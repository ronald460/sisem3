{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/sweetalert.min.css' %}" />
    <script src="/static/js/sweetalert.min.js"></script>
    <script src="/static/js/jquery-3.7.0.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
  </head>
  <body>
    {% load static %}

    <header class="main-header">
      <div class="header-container">
        <div class="header-left">
          <div class="logo-small">
            <a href="{% url 'home' %}">
              <img src="{% static 'image/semat_logo.png' %}" alt="SISEM" />
            </a>
          </div>

          <!-- WIDGET DE MONEDA -->
          <div class="currency-widget">
            <!-- Euro -->
            <div class="currency-item">
              <div class="currency-icon">
                <i class="bi bi-currency-euro"></i>
              </div>
              <div class="currency-info">
                <span class="currency-code">EUR</span>
                <span class="currency-value">{{ euro }}</span>
              </div>
            </div>

            <!-- Dólar -->
            <div class="currency-item">
              <div class="currency-icon" style="background: #10b981">
                <i class="bi bi-currency-dollar"></i>
              </div>
              <div class="currency-info">
                <span class="currency-code">USD</span>
                <span class="currency-value">{{ dolar }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Perfil de usuario -->
        <div class="user-profile-enhanced">
          <!-- Notificaciones -->
          <div class="notifications-wrapper">
            <div
              class="notifications-icon"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="bi bi-bell"></i>
              <span class="notifications-badge">3</span>
            </div>
            <!-- Opcional: dropdown de notificaciones -->
            <ul class="dropdown-menu dropdown-menu-end notifications-dropdown">
              <li>
                <a class="dropdown-item" href="#">📧 Nueva notificación 1</a>
              </li>
              <li>
                <a class="dropdown-item" href="#">🔔 Notificación importante</a>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <a class="dropdown-item text-primary" href="#">Ver todas</a>
              </li>
            </ul>
          </div>

          <!-- Perfil Dropdown -->
          <div class="profile-dropdown">
            <div class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle profile-link"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <div class="profile-avatar">
                  <i class="bi bi-person-circle"></i>
                </div>
                <span class="profile-username">{{ user.username }}</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="#">
                    <i class="bi bi-person"></i> Perfil
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" href="{% url 'password_change' %}">
                    <i class="bi bi-key"></i> Cambiar Contraseña
                  </a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a
                    class="dropdown-item text-danger"
                    href="{% url 'logout' %}"
                  >
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
