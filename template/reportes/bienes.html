{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/home.css' %}" />
    <link rel="stylesheet" href="{% static 'css/report/bienes.css' %}" />
    <link rel="stylesheet" href="{% static 'css/sweetalert.min.css' %}" />
    <script src="/static/js/datatables.js"></script>
    <script src="/static/js/sweetalert.min.js"></script>
    <script src="/static/js/jquery-3.7.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Reporte Bienes</title>
  </head>
  <body>
    {% if user.is_authenticated == 0 %}
    <meta http-equiv="refresh" content="0;url={% url 'login' %}" />
    {% endif %} {% if messages%} {% for m in messages %}
    <script>
      Swal.fire({
        title: "Felicidades",
        text: "{{m}}",
        icon: "success",
      });
    </script>
    {% endfor %} {% endif %} {% include 'header.html' %}
    <h1 class="title">Reporte de Bienes</h1>
    <form action="{% url 'export_bienes_excel' %}" method="GET">
      <div class="container">
        <div class="condicion">
          <label for="">Seleccione un Status:</label>
          <select name="status" id="status" class="form-select">
            <option value="all">Todos</option>
            <option value="Completo">Completo</option>
            <option value="Incompleto">Incompleto</option>
          </select>
        </div>
        <div class="tipo">
          <label for="">Seleccione una Condicion:</label>
          <select name="condicion" id="condicion" class="form-select">
            <option value="all">Todos</option>
            <option value="Bueno">Bueno</option>
            <option value="Dañado">Dañado</option>
          </select>
        </div>
        <div class="button">
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">
              Generar Reporte
            </button>
          </div>
        </div>
      </div>
    </form>
  </body>
</html>
