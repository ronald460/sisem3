<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/home.css' %}" />
    <link rel="stylesheet" href="{% static 'css/report/bien_area.css' %}" />
    <link rel="stylesheet" href="{% static 'css/sweetalert.min.css' %}" />
    <script src="/static/js/datatables.js"></script>
    <script src="/static/js/sweetalert.min.js"></script>
    <script src="/static/js/jquery-3.7.0.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Rep. Bienes x Area</title>
  </head>
  <body>
    {% if user.is_authenticated == 0 %}
    <meta http-equiv="refresh" content="0;url={% url 'login' %}" />
    {% endif %} {% if messages%} {% for m in messages %}
    <script>
      Swal.fire({
        title: "Felicidades",
        text: "{{m}}",
        icon: "success",
      });
    </script>
    {% endfor %} {% endif %} {% include 'header.html' %}
    <h1>Reporte de Bienes por Area</h1>
    <form action="" method="post">
      <div class="grid-container">
        <div class="grid-item item-1">
          <label for="area">Selecciona un Área:</label>
          <select name="area" id="area">
            {% for a in areas %}
            <option value="{{a.id}}">{{a.name}}</option>
            {% endfor %}
          </select>
        </div>
        <div class="grid-item item-2">
            <label for="tipo">Tipo</label>
            <select name="tipo" id="tipo">
                <option value="bm">Bienes Semat</option>
                <option value="descripcion">Control Interno</option>
                <option value="funcionario">Procedencia Desconocida</option>
        </div>
        <div class="grid-item item-3">
            <button type="submit" class="btn-submit">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
      </div>
    </form>
  </body>
</html>
